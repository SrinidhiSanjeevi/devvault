version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devvault-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/devvault
      - JWT_SECRET=devvaultsecret123
      - NODE_ENV=development
      - LOG_LEVEL=debug
    depends_on:
      - mongodb
    networks:
      - devvault-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devvault-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - devvault-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  mongodb:
    image: mongo:6-jammy
    container_name: devvault-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - devvault-network

volumes:
  mongo-data:

networks:
  devvault-network:
    driver: bridge
